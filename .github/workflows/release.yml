name: release

# タグ push (v*) でリリースを作る。Windows/Linux のバイナリに LICENSE と
# ドキュメントを同梱して GitHub Releases に置く(Phase 9)。
# 両 OS のビルドが揃ってから release ジョブが一括で公開する(片方だけ
# 成功した不完全なリリースが残らないようにする)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: nmnl-browser
            asset_name: nmnl-browser-linux-x86_64.tar.gz
          - os: windows-latest
            artifact: nmnl-browser.exe
            asset_name: nmnl-browser-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgtk-3-dev libappindicator3-dev \
            libdbus-1-dev libxdo-dev
      - run: cargo build --release --locked
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/nmnl-browser
          cp target/release/nmnl-browser dist/nmnl-browser/
          cp LICENSE README.md dist/nmnl-browser/
          cp -r docs dist/nmnl-browser/
          tar -C dist -czf "${{ matrix.asset_name }}" nmnl-browser
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist/nmnl-browser
          cp "target/release/${{ matrix.artifact }}" dist/nmnl-browser/
          cp LICENSE README.md dist/nmnl-browser/
          cp -r docs dist/nmnl-browser/
          (cd dist && 7z a "../${{ matrix.asset_name }}" nmnl-browser)
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    # 両プラットフォームのビルドが成功してからだけ公開する
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nmnl-browser-*
          merge-multiple: true
      - name: Create or update GitHub Release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # チェックアウトしないジョブなので対象リポジトリを明示する
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la
          if gh release view "${{ github.ref_name }}" > /dev/null 2>&1; then
            # 前回実行が途中で失敗した場合など、既存リリースには差し替え添付する
            gh release upload "${{ github.ref_name }}" --clobber \
              nmnl-browser-*.tar.gz nmnl-browser-*.zip
          else
            # ドラフトで作り、アセット添付が揃ってから公開する
            # (添付途中の不完全なリリースが見えないよう公開は最後に行う)
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" --generate-notes --draft
            gh release upload "${{ github.ref_name }}" --clobber \
              nmnl-browser-*.tar.gz nmnl-browser-*.zip
          fi
          # 既存リリースがドラフトのまま残った場合もここで公開状態に揃える
          gh release edit "${{ github.ref_name }}" --draft=false
