name: release

# タグ push (v*) でリリースを作る。Windows/Linux のバイナリに LICENSE と
# ドキュメントを同梱して GitHub Releases に置く(Phase 9)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: nmnl-browser
            asset_name: nmnl-browser-linux-x86_64.tar.gz
          - os: windows-latest
            artifact: nmnl-browser.exe
            asset_name: nmnl-browser-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgtk-3-dev libappindicator3-dev \
            libdbus-1-dev libxdo-dev
      - run: cargo build --release --locked
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/nmnl-browser
          cp target/release/nmnl-browser dist/nmnl-browser/
          cp LICENSE README.md dist/nmnl-browser/
          cp -r docs dist/nmnl-browser/
          tar -C dist -czf "${{ matrix.asset_name }}" nmnl-browser
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist/nmnl-browser
          cp "target/release/${{ matrix.artifact }}" dist/nmnl-browser/
          cp LICENSE README.md dist/nmnl-browser/
          cp -r docs dist/nmnl-browser/
          (cd dist && 7z a "../${{ matrix.asset_name }}" nmnl-browser)
      # どちらの OS ジョブが先でも作れるよう、両方で作成を試みてから添付する
      - name: Create GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "${{ matrix.asset_name }}" --clobber
