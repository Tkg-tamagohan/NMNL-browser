[package]
name = "nmnl-mock"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "NMNL-browser の UI モック(Phase 5、WASM プレビュー用)"

# ネイティブ側の依存(tokio/reqwest/keyring 等)は wasm32 でビルドできないため、
# モックは eframe のみに依存する別クレートとする
[dependencies]
eframe = "0.32"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
console_error_panic_hook = "0.1"
