[package]
name = "nmnl-browser"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "misskey.io 専用の軽量デッキクライアント"

[workspace]
members = ["mock"]

[dependencies]
eframe = "0.32"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "6"
keyring = { version = "3", features = ["windows-native", "linux-native-sync-persistent", "crypto-rust"] }
uuid = { version = "1", features = ["v4"] }
open = "5"
tempfile = "3"
# 画像デコード(ImageLoader)。URI→バイト列は自前の BytesLoader(ディスク LRU、F-08-2)。
# misskey が返す画像は webp/gif が大半のため、対応フォーマットを有効化する
# (png のみだと全外部画像がプレースホルダ表示になる)
egui_extras = { version = "0.32", features = ["image", "gif", "webp"] }
# jpeg 対応(egui_extras 側には jpeg 機能がないため、feature 統合で image を強化)。
# 既定機能は不要フォーマット(AVIF 等)まで引き込むため外し、必要分のみ
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# キャッシュファイル名の安定化(F-08-2)。MIT/Apache-2.0 デュアル
sha2 = "0.10"
futures-util = "0.3"
# connect_async(クライアント)+ accept_async(テスト用サーバー)と rustls TLS。
# reqwest と同じく webpki-roots 系で統一する
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# WS URL のトークンを ?i= に載せるときのパーセントエンコード用(MIT)
url = "2"
urlencoding = "2"
# トレイ常駐(F-09-4)。Linux は libappindicator3、Windows はネイティブ
tray-icon = "0.21"
gtk = "0.18"

[dev-dependencies]
httpmock = "0.8"

# N-01 の配布物サイズ目標(30MB 以内)に向けた release プロファイル
[profile.release]
lto = "thin"
strip = true
